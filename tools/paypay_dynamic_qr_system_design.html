<!-- TAB 3: Payment state machine -->
<div class="pane" id="pane2">
<svg width="100%" viewBox="0 0 680 460" role="img">
<title>PayPay QR payment state machine</title>
<desc>Payment states from QR created through authorized completed canceled expired and failed with transitions</desc>
<defs>
<marker id="ar3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- States -->
<g class="node c-gray" onclick="sendPrompt('What happens when a PayPay QR code is created?')">
  <rect x="270" y="30" width="140" height="44" rx="6" stroke-width="0.5"/>
  <text class="th" x="340" y="48" text-anchor="middle" dominant-baseline="central">QR created</text>
  <text class="ts" x="340" y="65" text-anchor="middle" dominant-baseline="central">codeId issued · TTL 10 min</text>
</g>

<line x1="340" y1="74" x2="340" y2="110" stroke="var(--color-border-secondary)" stroke-width="1.5" marker-end="url(#ar3)"/>
<text class="ts" x="348" y="94" dominant-baseline="central" style="fill:var(--color-text-tertiary)">user scans</text>

<g class="node c-amber" onclick="sendPrompt('What does the AUTHORIZED state mean in PayPay?')">
  <rect x="270" y="112" width="140" height="44" rx="6" stroke-width="0.5"/>
  <text class="th" x="340" y="130" text-anchor="middle" dominant-baseline="central">AUTHORIZED</text>
  <text class="ts" x="340" y="147" text-anchor="middle" dominant-baseline="central">wallet locked · awaiting capture</text>
</g>

<!-- AUTHORIZED → COMPLETED -->
<line x1="340" y1="156" x2="340" y2="220" stroke="var(--color-border-secondary)" stroke-width="1.5" marker-end="url(#ar3)"/>
<text class="ts" x="348" y="190" dominant-baseline="central" style="fill:var(--color-text-tertiary)">capture</text>

<!-- AUTHORIZED → CANCELED (revert) -->
<path d="M270 140 Q160 140 160 280 Q160 340 270 340" fill="none" stroke="var(--color-border-secondary)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar3)"/>
<text class="ts" x="90" y="230" text-anchor="middle" dominant-baseline="central" style="fill:var(--color-text-tertiary)">revert /</text>
<text class="ts" x="90" y="245" text-anchor="middle" dominant-baseline="central" style="fill:var(--color-text-tertiary)">cancel</text>

<g class="node c-green" onclick="sendPrompt('What happens when a PayPay payment is completed?')">
  <rect x="270" y="222" width="140" height="44" rx="6" stroke-width="0.5"/>
  <text class="th" x="340" y="240" text-anchor="middle" dominant-baseline="central">COMPLETED</text>
  <text class="ts" x="340" y="257" text-anchor="middle" dominant-baseline="central">wallet debited · webhook fired</text>
</g>

<!-- COMPLETED → REFUNDED -->
<line x1="410" y1="244" x2="500" y2="310" stroke="var(--color-border-secondary)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar3)"/>
<text class="ts" x="470" y="268" dominant-baseline="central" style="fill:var(--color-text-tertiary)">refund</text>

<g class="node c-blue" onclick="sendPrompt('What does the REFUNDED state mean in PayPay?')">
  <rect x="502" y="300" width="140" height="44" rx="6" stroke-width="0.5"/>
  <text class="th" x="572" y="318" text-anchor="middle" dominant-baseline="central">REFUNDED</text>
  <text class="ts" x="572" y="335" text-anchor="middle" dominant-baseline="central">partial or full · 90-day window</text>
</g>

<g class="node c-red" onclick="sendPrompt('What triggers a PayPay payment CANCELED state?')">
  <rect x="270" y="328" width="140" height="44" rx="6" stroke-width="0.5"/>
  <text class="th" x="340" y="346" text-anchor="middle" dominant-baseline="central">CANCELED</text>
  <text class="ts" x="340" y="363" text-anchor="middle" dominant-baseline="central">user cancel or merchant cancel</text>
</g>

<!-- QR created → EXPIRED -->
<line x1="410" y1="52" x2="510" y2="130" stroke="var(--color-border-secondary)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar3)"/>
<text class="ts" x="475" y="90" dominant-baseline="central" style="fill:var(--color-text-tertiary)">TTL elapsed</text>

<g class="node c-gray" onclick="sendPrompt('What happens when a PayPay QR code expires?')">
  <rect x="512" y="112" width="140" height="44" rx="6" stroke-width="0.5"/>
  <text class="th" x="582" y="130" text-anchor="middle" dominant-baseline="central">EXPIRED</text>
  <text class="ts" x="582" y="147" text-anchor="middle" dominant-baseline="central">QR invalid · create new code</text>
